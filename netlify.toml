[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# El driver de MongoDB no debe empaquetarse con esbuild (falla en producción).
[functions.auth]
  external_node_modules = ["mongodb"]

# API routes → Netlify Functions
[[redirects]]
  from = "/api/auth/*"
  to = "/.netlify/functions/auth/:splat"
  status = 200

[[redirects]]
  from = "/api/auth"
  to = "/.netlify/functions/auth"
  status = 200

# SPA: todas las demás rutas sirven index.html (React Router)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
